<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Document Search - Phase 4</title>
  <style>
    body { font-family: sans-serif; max-width: 650px; margin: 40px auto; padding: 0 20px; }
    input, button { padding: 10px; font-size: 15px; margin-top: 10px; }
    .card { background: #f8f9fa; border: 1px solid #ddd; border-left: 4px solid #007bff; padding: 15px; margin-top: 15px; border-radius: 4px; }
    .score { font-weight: bold; color: #28a745; }
    hr { margin: 30px 0; border: none; border-top: 1px solid #ccc; }
  </style>
</head>
<body>
  <h2>Phase 4: Vector Store & Semantic Search</h2>
  
  <h3>1. Upload Document</h3>
  <input type="file" id="fileInput" accept=".txt,.md">
  <button id="uploadBtn">Upload to Vector DB</button>
  <div id="uploadStatus"></div>

  <hr>

  <h3>2. Search Document Contents</h3>
  <input type="text" id="searchInput" placeholder="Ask a question about uploaded files..." style="width: 70%;">
  <button id="searchBtn">Semantic Search</button>

  <div id="searchResults"></div>

  <script src="app.js"></script>
</body>
</html>
